<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音对话机器人</title>
    <link rel="stylesheet" href="/static/style.css?v=20260908">
</head>
<body>
    <!-- 登录/注册界面 -->
    <div id="auth-screen" class="auth-screen">
        <div class="auth-box">
            <h1>语音对话机器人</h1>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">登录</button>
                <button class="auth-tab" data-tab="register">注册</button>
            </div>
            <form id="login-form" class="auth-form">
                <input type="text" id="login-username" placeholder="用户名" required>
                <input type="password" id="login-password" placeholder="密码" required>
                <button type="submit">登录</button>
            </form>
            <form id="register-form" class="auth-form hidden">
                <input type="text" id="register-username" placeholder="用户名" required>
                <input type="password" id="register-password" placeholder="密码" required>
                <button type="submit">注册</button>
            </form>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="main-app" class="app hidden">
        <!-- 左侧：会话列表 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>会话</h1>
                <button id="new-session-btn" title="新建会话">＋</button>
            </div>
            <ul id="session-list"></ul>
            <div class="sidebar-footer">
                <span id="current-username" class="username"></span>
                <button id="settings-btn">⚙ 设置</button>
                <button id="logout-btn">退出</button>
            </div>
        </aside>

        <!-- 中央：对话区 -->
        <main class="main">
            <header class="main-header">
                <span id="session-title">未选择会话</span>
                <span id="status-dot" class="status-dot idle"></span>
                <span id="status-text">空闲</span>
                <div id="mic-level" class="mic-level hidden" title="麦克风输入电平：说话时条纹应跳动">
                    <span class="mic-level-label">🎤</span>
                    <div class="mic-level-track"><div id="mic-level-bar"></div></div>
                </div>
                <button id="board-toggle-btn" class="board-toggle active" title="显示/隐藏小黑板">📋 黑板</button>
            </header>
            <div class="work-area">
                <div id="board-panel" class="board-panel">
                    <div class="board-bar">
                        <span class="board-title">📋 小黑板</span>
                        <button id="board-clear-btn" class="board-clear" title="擦掉黑板全部内容">清空</button>
                    </div>
                    <div id="board-content" class="board-content"></div>
                </div>
                <div id="board-divider" class="board-divider" title="按住上下拖动调整黑板与聊天区比例"></div>
                <div id="transcript" class="transcript"></div>
            </div>
            <div id="disconnect-banner" class="banner hidden">
                连接已断开
                <button id="reconnect-btn">重连</button>
            </div>
            <footer class="controls">
                <button id="talk-btn" class="talk-btn">🎙 开始对话</button>
            </footer>
        </main>

        <!-- 右侧抽屉：设置 -->
        <aside id="settings-drawer" class="drawer hidden">
            <div class="drawer-header">
                <h2>设置</h2>
                <button id="close-settings-btn">✕</button>
            </div>

            <label class="field-label" for="prompt-input">System Prompt（人设）</label>
            <textarea id="prompt-input" rows="8" placeholder="例如：你是一位耐心的法语老师，请用简单的法语和我对话，并在每句话后附上中文翻译。"></textarea>
            <div class="row">
                <button id="save-prompt-btn">保存并生效</button>
            </div>

            <label class="field-label" for="preset-select">人设预设</label>
            <div class="row">
                <select id="preset-select"></select>
                <button id="apply-preset-btn">应用</button>
                <button id="save-preset-btn">存为预设</button>
                <button id="delete-preset-btn">删除</button>
            </div>

            <label class="field-label">输出模式</label>
            <div class="row radio-row">
                <label><input type="radio" name="output-mode" value="audio_text" checked> 语音+文字</label>
                <label><input type="radio" name="output-mode" value="audio"> 仅语音</label>
                <label><input type="radio" name="output-mode" value="text"> 仅文字</label>
            </div>

            <label class="field-label">我的凭证</label>
            <label class="field-label-small">Base URL</label>
            <input type="text" id="cred-base-url" placeholder="留空用默认">
            <label class="field-label-small">API Key</label>
            <input type="password" id="cred-api-key" placeholder="">
            <div class="row">
                <button id="save-credentials-btn">保存凭证</button>
            </div>
            <p id="credential-status" class="hint"></p>

            <label class="field-label">上下文管理</label>
            <div class="row">
                <span id="context-usage" class="hint">上下文用量：--</span>
            </div>
            <div class="row">
                <button id="compress-btn" title="把旧对话总结成一条摘要，降低上下文占用">压缩上下文</button>
                <button id="clear-history-btn" title="清空本会话全部对话记录">清空历史</button>
            </div>

            <label class="field-label">其他</label>
            <div class="row">
                <label><input type="checkbox" id="subtitle-toggle" checked> 显示字幕</label>
            </div>

            <p class="hint">建议佩戴耳机，避免外放声音被麦克风拾取造成误打断。</p>
        </aside>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="/static/audio.js?v=20260907"></script>
    <script src="/static/app.js?v=20260907"></script>
</body>
</html>
