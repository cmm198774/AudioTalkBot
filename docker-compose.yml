###############################################################################
#  语音对话机器人 Docker Compose 编排
#
#  目标平台: Linux (阿里云 ECS / 轻量应用服务器)
#  网络策略: bridge 网络
#
#  使用方式:
#    1. 确保 .env 文件存在（可以为空，用户在界面上配置 API Key）
#    2. docker-compose up -d --build
#    3. 访问 http://<服务器IP>:8000
###############################################################################
version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════
  # 语音对话机器人主服务（FastAPI + WebSocket）
  # ═══════════════════════════════════════════════════════════
  voice-chatbot:
    build: .
    container_name: voice-chatbot
    ports:
      - "8000:8000"
    volumes:
      # 持久化用户数据
      - ./data:/app/data
      # 挂载 .env 文件（只读）
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # 健康检查（镜像内无 curl，用 python 标准库探活）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 开发环境可以取消注释下面这行，实现代码热更新
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
